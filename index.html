<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeHub — Персональное пространство</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-surface: #ffffff;
            --text-primary: #1a1d20;
            --text-secondary: #6c757d;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --border: #e9ecef;
            --radius: 12px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Мобильная шапка (скрыта на ПК) */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            align-items: center;
            justify-content: space-between;
            z-index: 900;
        }

        .menu-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 20px;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 950;
        }

        .sidebar-overlay.open {
            display: block;
        }

        aside {
            width: 250px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            transition: transform 0.25s ease;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            padding: 0 12px 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .nav-item {
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: var(--bg-main);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .backup-box {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .backup-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .backup-btn {
            width: 100%;
            padding: 8px 12px;
            font-size: 13px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .backup-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        main {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        /* Адаптация под смартфоны и планшеты */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }
            aside {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
            aside.open {
                transform: translateX(0);
            }
            .close-sidebar-btn {
                display: block;
            }
            main {
                padding: 76px 16px 24px;
            }
            h1 {
                font-size: 22px;
            }
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            .cal-day {
                padding: 10px 4px;
                font-size: 13px;
            }
        }

        .section { display: none; animation: fadeIn 0.25s ease; }
        .section.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 15px; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .card h3 { font-size: 17px; margin-bottom: 12px; }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--bg-main);
        }

        input:focus, textarea:focus { border-color: var(--accent); background: var(--bg-surface); }

        button.primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        button.secondary { background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }

        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--bg-main);
            border-radius: 8px;
        }
        .task-item.done span { text-decoration: line-through; color: var(--text-secondary); }

        .calc-wrapper { max-width: 320px; margin: 0 auto; }
        .calc-display {
            width: 100%;
            height: 60px;
            font-size: 26px;
            text-align: right;
            padding: 10px 15px;
            margin-bottom: 12px;
            background: var(--bg-main);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn {
            padding: 16px;
            font-size: 18px;
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        .calc-btn.op { background: var(--accent-light); color: var(--accent); }
        .calc-btn.eq { background: var(--accent); color: white; grid-column: span 2; }

        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-day-name { font-weight: 600; color: var(--text-secondary); font-size: 13px; padding-bottom: 8px; }
        .cal-day { padding: 14px 8px; background: var(--bg-main); border-radius: 8px; font-size: 14px; }
        .cal-day.today { background: var(--accent); color: white; font-weight: 700; }
        .cal-day.empty { background: transparent; }

        .entry-card { border-left: 3px solid var(--accent); padding-left: 14px; margin-bottom: 14px; }
        .entry-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }

        .media-thumb {
            height: 120px;
            background: var(--bg-main);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .tag {
            display: inline-block;
            padding: 4px 8px;
            background: var(--accent-light);
